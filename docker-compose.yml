name: grocery-intelligence
x-app-env: &app-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  CLICKHOUSE_HOST: clickhouse
  CLICKHOUSE_PORT: 8123
  CLICKHOUSE_DATABASE: grocery
  CLICKHOUSE_USER: ${CLICKHOUSE_USER:-grocery}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-grocery_local}
  EVENT_RATE: ${EVENT_RATE:-5}
  SIMULATION_SPEED: ${SIMULATION_SPEED:-1}
  RANDOM_SEED: ${RANDOM_SEED:-42}
services:
  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports: ["${KAFKA_UI_PORT:-8081}:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka: {condition: service_healthy}
    restart: unless-stopped
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports: ["${CLICKHOUSE_HTTP_PORT:-8123}:8123", "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"]
    environment:
      CLICKHOUSE_DB: grocery
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-grocery}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-grocery_local}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes: ["clickhouse_data:/var/lib/clickhouse", "./docker/clickhouse/init:/docker-entrypoint-initdb.d:ro"]
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "${CLICKHOUSE_USER:-grocery}", "--password", "${CLICKHOUSE_PASSWORD:-grocery_local}", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  simulator:
    build: {context: ., dockerfile: docker/python.Dockerfile}
    command: ["python", "-m", "src.simulator.main"]
    environment:
      <<: *app-env
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      WEATHER_POLL_SECONDS: ${WEATHER_POLL_SECONDS:-900}
    depends_on:
      kafka: {condition: service_healthy}
    restart: unless-stopped
  processor:
    build: {context: ., dockerfile: docker/python.Dockerfile}
    command: ["python", "-m", "src.streaming.consumer"]
    environment: *app-env
    depends_on:
      kafka: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
    restart: unless-stopped
  ml-service:
    build: {context: ., dockerfile: docker/python.Dockerfile}
    command: ["python", "-m", "src.ml.pipeline"]
    environment: *app-env
    depends_on:
      clickhouse: {condition: service_healthy}
    restart: unless-stopped
  api:
    build: {context: ., dockerfile: docker/python.Dockerfile}
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *app-env
      AI_PROVIDER: ${AI_PROVIDER:-google}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-gemini-3.8-flash}
    ports: ["${API_PORT:-8000}:8000"]
    depends_on:
      clickhouse: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 8
    restart: unless-stopped
volumes:
  clickhouse_data:
